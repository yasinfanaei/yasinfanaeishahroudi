components:
  seo:
    type: object
    label: SEO
    fields:
    - name: title
      label: SEO title
      type: string
    - name: description
      label: Meta description
      type: text
    - name: image
      label: Social preview image
      type: image
      options:
        media: images
        rename: safe
    - name: canonical_override
      label: Canonical URL override (advanced)
      type: string
      pattern: ^$|^https://.+
      description: Usually leave blank. Use only when this page intentionally canonicalizes to another HTTPS URL.
    - name: noindex
      label: Noindex this page
      type: boolean
  profile_hero_block:
    type: object
    label: Profile Hero
    fields:
    - name: id
      label: Block ID
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Stable ID. Use lowercase letters, numbers, and hyphens.
    - name: enabled
      label: Visible / نمایش
      type: boolean
  heading_block:
    type: object
    label: Heading
    fields:
    - name: id
      label: Block ID
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Stable ID. Use lowercase letters, numbers, and hyphens.
    - name: enabled
      label: Visible / نمایش
      type: boolean
    - name: eyebrow
      label: Eyebrow
      type: string
    - name: title
      label: Heading
      type: string
      required: true
    - name: level
      label: Heading level
      type: select
      options:
        values:
        - name: h2
          label: H2
        - name: h3
          label: H3
    - name: lead
      label: Lead text
      type: text
  rich_text_block:
    type: object
    label: Rich text
    fields:
    - name: id
      label: Block ID
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Stable ID. Use lowercase letters, numbers, and hyphens.
    - name: enabled
      label: Visible / نمایش
      type: boolean
    - name: content
      label: Content
      type: rich-text
      options:
        format: html
        switcher: false
        media: false
  image_block:
    type: object
    label: Image
    fields:
    - name: id
      label: Block ID
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Stable ID. Use lowercase letters, numbers, and hyphens.
    - name: enabled
      label: Visible / نمایش
      type: boolean
    - name: image
      label: Image
      type: image
      required: true
      options:
        media: images
        rename: safe
    - name: alt
      label: Alt text
      type: string
      required: true
      description: Describe the image for accessibility.
    - name: caption
      label: Caption
      type: text
    - name: width
      label: Width
      type: select
      options:
        values:
        - 100%
        - 75%
        - 50%
  callout_block:
    type: object
    label: Callout
    fields:
    - name: id
      label: Block ID
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Stable ID. Use lowercase letters, numbers, and hyphens.
    - name: enabled
      label: Visible / نمایش
      type: boolean
    - name: title
      label: Title
      type: string
    - name: body
      label: Body
      type: text
      required: true
    - name: tone
      label: Tone
      type: select
      options:
        values:
        - default
        - info
        - success
        - warning
    - name: url
      label: Optional link
      type: string
    - name: link_label
      label: Link label
      type: string
  buttons_block:
    type: object
    label: Buttons
    fields:
    - name: id
      label: Block ID
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Stable ID. Use lowercase letters, numbers, and hyphens.
    - name: enabled
      label: Visible / نمایش
      type: boolean
    - name: items
      label: Buttons
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
      fields:
      - name: label
        type: string
        required: true
      - name: url
        type: string
        required: true
      - name: style
        type: select
        options:
          values:
          - primary
          - secondary
          - text
  cards_block:
    type: object
    label: Cards
    fields:
    - name: id
      label: Block ID
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Stable ID. Use lowercase letters, numbers, and hyphens.
    - name: enabled
      label: Visible / نمایش
      type: boolean
    - name: items
      label: Cards
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        type: string
        required: true
      - name: text
        type: text
      - name: image
        type: image
        options:
          media: images
          rename: safe
      - name: alt
        label: Image alt text
        type: string
      - name: url
        type: string
      - name: link_label
        type: string
  contact_methods_block:
