settings:
  content:
    merge: true
content:
- name: english
  label: English
  type: group
  items:
  - name: en_profile
    label: Profile & Contact
    type: file
    path: content/en/profile.json
    format: json
    fields:
    - name: name
      label: Full name
      type: string
      required: true
    - name: headline
      label: Academic headline
      type: string
      required: true
    - name: affiliation
      label: Affiliation
      type: string
      required: true
    - name: location
      label: Public location
      type: string
    - name: email
      label: Legacy primary email (compatibility)
      type: string
      required: false
      description: New public contact methods are managed in Contact methods below.
    - name: eyebrow
      label: Home-page eyebrow
      type: string
    - name: bio
      label: Research profile
      type: text
    - name: short_bio
      label: Short biography
      type: text
    - name: links
      label: Academic profile links
      type: object
      fields:
      - name: google_scholar
        label: Google Scholar
        type: string
      - name: orcid
        label: ORCID
        type: string
      - name: researchgate
        label: ResearchGate
        type: string
      - name: linkedin
        label: LinkedIn
        type: string
      - name: github
        label: GitHub
        type: string
      - name: institutional_profile
        label: Institutional profile
        type: string
    - &id008
      name: contacts
      label: Contact methods / راه‌های ارتباطی
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label} — {value}'
      description: Only add contact details you intentionally want to publish on this public website.
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: type
        label: Type
        type: select
        required: true
        options:
          values:
          - name: email
            label: Email
          - name: phone
            label: Phone
          - name: whatsapp
            label: WhatsApp
          - name: telegram
            label: Telegram
          - name: website
            label: Website
          - name: office
            label: Office
          - name: location
            label: Location
          - name: custom
            label: Custom
      - name: label
        label: Public label
        type: string
        required: true
      - name: value
        label: Public value
        type: string
        required: true
      - name: url
        label: Optional explicit URL
        type: string
      - name: enabled
        label: Enabled
        type: boolean
      - name: show_home
        label: Show on homepage
        type: boolean
      - name: show_contact
        label: Show on contact page
        type: boolean
      - name: show_footer
        label: Show in footer
        type: boolean
    operations:
      create: false
      rename: false
      delete: false
  - name: en_education
    label: Education
    type: file
    path: content/en/education.json
    format: json
    fields:
    - name: items
      label: Degrees
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{degree} — {institution}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: degree
        label: Degree
        type: string
        required: true
      - name: institution
        label: Institution
        type: string
        required: true
      - name: field
        label: Field
        type: string
      - name: period
        label: Period / status
        type: string
      - name: gpa
        label: GPA
        type: string
      - name: note
        label: Note
        type: text
    operations:
      create: false
      rename: false
      delete: false
  - name: en_research
    label: Research
    type: file
    path: content/en/research.json
    format: json
    fields:
    - name: intro
      label: Research-page introduction
      type: text
    - name: interests
      label: Research interests
      type: string
      list: true
    - name: themes
      label: Research themes
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
    - name: thesis
      label: Master's thesis
      type: object
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: title
        label: English rendering
        type: string
        required: true
      - name: title_fa
        label: Persian title
        type: string
      - name: degree
        label: Degree
        type: string
      - name: institution
        label: Institution
        type: string
      - name: supervisor
        label: Supervisor
        type: string
      - name: grade
        label: Grade
        type: string
      - name: note
        label: Note
        type: text
    operations:
      create: false
      rename: false
      delete: false
  - name: en_publications
    label: Publications
    type: file
    path: content/en/publications.json
    format: json
    fields:
    - name: intro
      label: Publications-page introduction
      type: text
    - name: items
      label: Publications & presentations
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title} — {year}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: title
        label: English rendering
        type: string
        required: true
      - name: official_english_title
        label: Official English title (only if verified)
        type: string
      - name: title_fa
        label: Persian title
        type: string
      - name: type
        label: Output type
        type: select
        required: true
        options:
          values:
          - name: journal
            label: Journal article
          - name: conference
            label: Conference paper / presentation
          - name: working_paper
            label: Working paper
          - name: book_chapter
            label: Book chapter
          - name: report
            label: Research report
      - name: status
        label: Publication status
        type: select
        options:
          values:
          - name: accepted
            label: Accepted
          - name: published
            label: Published
          - name: published_or_accepted
            label: Published / accepted (source is ambiguous)
          - name: working_paper
            label: Working paper
          - name: under_review
            label: Under review
      - name: authors
        label: Authors
        type: string
        list: true
      - name: corresponding_author
        label: Corresponding author
        type: string
      - name: venue
        label: Venue as reported
        type: string
      - name: venue_english_rendering
        label: English venue rendering
        type: string
      - name: year
        label: Year
        type: string
      - name: doi
        label: DOI (verified only)
        type: string
      - name: url
        label: Publication URL (verified only)
        type: string
      - name: abstract
        label: Abstract / چکیده
        type: text
      - name: keywords
        label: Keywords / کلیدواژه‌ها
        type: string
        list: true
      - name: volume
        label: Volume (verified only)
        type: string
      - name: issue
        label: Issue (verified only)
        type: string
      - name: pages
        label: Pages (verified only)
        type: string
      - name: pdf
        label: PDF / فایل مقاله
        type: file
        options:
          media: publication_files
          extensions:
          - pdf
          rename: safe
      - name: data_url
        label: Data URL / پیوند داده
        type: string
      - name: code_url
        label: Code URL / پیوند کد
        type: string
      - name: replication_url
        label: Replication URL / بسته بازتولید
        type: string
      - name: note
        label: Note
        type: text
      - name: featured
        label: Feature on CV/home
        type: boolean
    operations:
      create: false
      rename: false
      delete: false
  - name: en_projects
    label: Projects
    type: file
    path: content/en/projects.json
    format: json
    fields:
    - name: items
      label: Research projects
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: title
        label: English title
        type: string
        required: true
      - name: title_fa
        label: Persian title
        type: string
      - name: role
        label: Role
        type: string
      - name: lead
        label: Project lead
        type: string
      - name: description
        label: Description
        type: text
      - name: url
        label: Project URL
        type: string
    operations:
      create: false
      rename: false
      delete: false
  - name: en_experience
    label: Experience & Service
    type: file
    path: content/en/experience.json
    format: json
    fields:
    - name: items
      label: Experience entries
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title} — {period}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
          - name: research
            label: Research
          - name: professional
            label: Professional
          - name: service
            label: Academic service
          - name: other
            label: Other
      - name: title
        label: Title
        type: string
        required: true
      - name: organization
        label: Organization
        type: string
      - name: period
        label: Period
        type: string
      - name: description
        label: Description
        type: text
    operations:
      create: false
      rename: false
      delete: false
  - name: en_awards
    label: Awards
    type: file
    path: content/en/awards.json
    format: json
    fields:
    - name: items
      label: Honors & awards
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title} — {year}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: title
        label: Title
        type: string
        required: true
      - name: issuer
        label: Issuer
        type: string
      - name: year
        label: Year
        type: string
      - name: description
        label: Description
        type: text
    operations:
      create: false
      rename: false
      delete: false
  - name: en_skills
    label: Skills & Certificates
    type: file
    path: content/en/skills.json
    format: json
    fields:
    - name: groups
      label: Skill / training groups
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: title
        label: Group title
        type: string
        required: true
      - name: items
        label: Items
        type: string
        list: true
    - name: note
      label: Public note
      type: text
    operations:
      create: false
      rename: false
      delete: false
  - name: en_news
    label: News & Updates
    type: file
    path: content/en/news.json
    format: json
    fields:
    - name: intro
      label: Page introduction / معرفی صفحه
      type: text
    - name: items
      label: Updates / تازه‌ها
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title} — {date}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: date
        label: Date
        type: date
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
      - name: category
        label: Category
        type: string
      - name: url
        label: Optional link
        type: string
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: published
        label: Publicly visible
        type: boolean
    operations:
      create: false
      rename: false
      delete: false
  - name: en_pages
    label: Pages
    type: collection
    path: content/pages/en
    format: json
    filename:
      template: '{id}.json'
      field: create
    view:
      fields:
      - title
      - slug
      - status
      - translation_key
      primary: title
      sort:
      - title
      - slug
      - status
      search:
      - title
      - slug
      - id
      - translation_key
    operations:
      create: true
      rename: true
      delete: true
    fields:
    - name: id
      label: Stable page ID
      type: string
      required: true
      pattern: ^[a-z0-9-]+$
      description: Stable internal ID. Avoid changing after publishing.
    - name: slug
      label: Public URL slug
      type: string
