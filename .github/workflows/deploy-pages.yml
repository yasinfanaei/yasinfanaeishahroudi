name: Build and Deploy Academic Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate source repository
        run: python scripts/check_site.py
      - name: Check enhancement JavaScript syntax
        run: node --check src/static/site.js
      - name: Build static site
        run: python -m src.build_site --output _site
      - name: Validate generated site
        run: python scripts/check_build.py _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
