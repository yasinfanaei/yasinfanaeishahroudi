<section class="block" id="{{ block.id }}">{% for item in data.experience['items'] %}<article class="experience-item"><h2>{{ item.title }}</h2><p>{{ item.organization }}{% if item.period %} · {{ item.period }}{% endif %}</p>{% if item.description %}<p>{{ item.description }}</p>{% endif %}</article>{% endfor %}</section>
