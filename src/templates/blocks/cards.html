<section class="block grid cards" id="{{ block.id }}">{% for card in block.get('items', []) %}<article class="surface">{% if card.image %}<img src="{{ card.image|site_href }}" alt="{{ card.alt or '' }}" loading="lazy">{% endif %}<h2>{{ card.title }}</h2><p>{{ card.text }}</p>{% if card.url %}<a href="{{ card.url|site_href }}">{{ card.link_label or card.url }}</a>{% endif %}</article>{% endfor %}</section>
