<section class="block" id="{{ block.id }}">{% if block.eyebrow %}<div class="eyebrow">{{ block.eyebrow }}</div>{% endif %}{% if block.level == 'h3' %}<h3>{{ block.title }}</h3>{% else %}<h2>{{ block.title }}</h2>{% endif %}{% if block.lead %}<p class="lead">{{ block.lead }}</p>{% endif %}</section>
