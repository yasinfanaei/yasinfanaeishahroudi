<section class="block grid cards" id="{{ block.id }}">{% for item in data.projects['items'] %}<article class="surface"><h2>{{ item.title }}</h2>{% if item.role %}<p class="muted">{{ item.role }}{% if item.lead %} · {{ item.lead }}{% endif %}</p>{% endif %}<p>{{ item.description }}</p>{% if item.url %}<a href="{{ item.url|site_href }}">Link</a>{% endif %}</article>{% endfor %}</section>
