<section class="block" id="{{ block.id }}"><div class="timeline">{% for item in data.education['items'] %}<article class="timeline-item"><h2>{{ item.degree }}</h2><p>{{ item.institution }}{% if item.period %} · {{ item.period }}{% endif %}</p>{% if item.gpa %}<p class="muted">GPA: {{ item.gpa }}</p>{% endif %}{% if item.note %}<p>{{ item.note }}</p>{% endif %}</article>{% endfor %}</div></section>
